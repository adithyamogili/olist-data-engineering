name: data-pipeline-ci
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src dags
      - run: pytest -q

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install dbt-core==1.9.2 dbt-postgres==1.9.0
      - run: dbt parse --project-dir dbt/olist_warehouse --profiles-dir dbt/olist_warehouse
        env:
          WAREHOUSE_HOST: localhost
          WAREHOUSE_USER: olist
          WAREHOUSE_PASSWORD: ci-placeholder
          WAREHOUSE_DB: olist
          WAREHOUSE_PORT: '5432'
